name: Prepare or publish approved alpha

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Target registry (no upload until its environment is approved)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      tag:
        description: Exact approved release tag, e.g. v0.2.0a1
        type: string
        required: true
      publish:
        description: Explicitly authorize uploading the tested artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.tag == github.ref_name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          PY
      - run: python -m pip install build twine .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
      url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/project/flagcheck/' || 'https://pypi.org/project/flagcheck/' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1, pinned
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
