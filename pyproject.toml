[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flagcheck"
version = "0.2.0a2"
description = "Conservative, schema-driven command-line flag linter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Parth Agrawal"}]
keywords = ["argparse", "cli", "lint", "makefile", "pre-commit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Repository = "https://github.com/aparth9100/flagcheck"
Issues = "https://github.com/aparth9100/flagcheck/issues"
Changelog = "https://github.com/aparth9100/flagcheck/blob/main/CHANGELOG.md"

[project.scripts]
flagcheck = "flagcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
